name: aac_studio
description: >-
  AAC Studio — original open-source AAC app builder with a live preview
  studio. Includes a research viewer that renders locally extracted IPA
  vocabulary data for study. No copyrighted assets ship with this repo.
publish_to: "none"
# Build number stays above every per-CPU APK ever shipped (they used
# 1000/2000/4000 + n), so the single universal APK always installs as an update.
version: 1.10.0+5009

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  crypto: ^3.0.7
  provider: ^6.1.2
  flutter_tts: ^4.2.0
  sherpa_onnx: 2.0.1
  piper_phonemize: 1.5.9
  audioplayers: 6.8.1
  archive: 4.6.0
  flutter_svg: ^2.0.10
  xml: ^7.0.1
  qr_flutter: ^4.1.0
  sqflite_common_ffi: ^2.3.3
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sample_pack.json
    - assets/factory_symbol_history.json
    - assets/symbol_index.json
    - assets/prediction_en_top10k.txt
    - assets/app_icon.png
    - assets/voices/piper-en-us-ljspeech-medium.tar.bz2
    - assets/voices/NOTICE.txt
    - assets/voices/GPL-3.0.txt
    - assets/voices/clips/sq/
    - assets/voices/clips/sq-f/
    - assets/symbol_aliases.json
    - assets/i18n/
    - assets/flat_symbols/
    - assets/flat_symbols/modernflat/
    - assets/flat_symbols/twemoji/
    - assets/flat_symbols/learning/
    - assets/flat_symbols/communication/
    - assets/symbols/mulberry/
