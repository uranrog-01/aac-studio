# Builds the unsigned iOS IPA on GitHub's macOS runners (free tier).
# Artifact: AACStudio-unsigned.ipa → sideload with Sideloadly (free Apple ID).
# See docs/IOS_SIGNING.md.

name: iOS unsigned IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Fetch dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          cd build/ios/iphoneos
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R Runner.app /tmp/ipa/Payload/Runner.app
          cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/build/ios/iphoneos/AACStudio-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AACStudio-unsigned-ipa
          path: build/ios/iphoneos/AACStudio-unsigned.ipa
