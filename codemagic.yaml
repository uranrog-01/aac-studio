# Codemagic CI — iOS (and Android) builds for AAC Studio
# https://docs.codemagic.io/yaml/yaml-getting-started/
#
# iOS builds require a Mac host (Apple's rules, not ours): the free tier
# builds without code signing. The packaged unsigned IPA installs on a real
# iPhone/iPad via Sideloadly or AltStore on Windows with a free Apple ID
# (7-day resign cycle), or via TestFlight with a paid developer account.

workflows:
  ios-no-signing:
    name: AAC Studio — iOS (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Fetch dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos || true
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
      - name: Package unsigned IPA (Sideloadly/AltStore-ready)
        script: |
          cd $CM_BUILD_DIR/build/ios/iphoneos
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R Runner.app /tmp/ipa/Payload/Runner.app
          cd /tmp/ipa && zip -qry "$CM_BUILD_DIR/build/ios/iphoneos/AACStudio-unsigned.ipa" Payload
          cd $CM_BUILD_DIR && cp build/ios/iphoneos/AACStudio-unsigned.ipa dist/AACStudio-unsigned.ipa
    artifacts:
      - build/ios/iphoneos/*.app
      - build/ios/iphoneos/*.ipa
      - dist/*.ipa
      - flutter_build_logs.txt

  android-release:
    name: AAC Studio — Android APK
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  windows-release:
    name: AAC Studio — Windows
    instance_type: windows_x2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
    scripts:
      - name: Build Windows
        script: flutter build windows --release
    artifacts:
      - build/windows/x64/runner/Release/**
