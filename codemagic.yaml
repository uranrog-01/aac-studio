# Codemagic CI — iOS (and Android) builds for AAC Studio
# https://docs.codemagic.io/yaml/yaml-getting-started/
#
# iOS builds require a Mac host (Apple's rules, not ours): the free tier
# builds without code signing — install to a real device via a signing
# certificate, or add signing in Codemagic's UI for App Store/TestFlight.

workflows:
  ios-no-signing:
    name: AAC Studio — iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter doctor
        script: flutter doctor -v
      - name: Fetch dependencies
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-infos || true
      - name: Build iOS (no codesign)
        script: flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_build_logs.txt

  android-release:
    name: AAC Studio — Android APK
    instance_type: linux_x2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
    scripts:
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk

  windows-release:
    name: AAC Studio — Windows
    instance_type: windows_x2
    max_build_duration: 60
    triggering:
      events: [push, tag]
      branch_patterns: [main]
    environment:
      flutter: stable
    scripts:
      - name: Build Windows
        script: flutter build windows --release
    artifacts:
      - build/windows/x64/runner/Release/**
